[pytest]
# F1T 測試框架設定
# 生成日期: 2026-04-04

# ── 測試探索 ─────────────────────────────────────────────────────────────
testpaths =
    tests/unit
    tests/integration

# 收集規則：只收集明確的 pytest 格式（排除 legacy 診斷腳本）
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ── 輸出格式 ─────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings

# ── 標記定義（避免 unknown mark 警告）───────────────────────────────────
markers =
    unit: 本機單元測試，無需網路/API
    integration: 整合測試，需要 API 服務器運行
    api: API 端點測試
    cli: CLI 功能測試
    gui: GUI 模組測試（需要 QApplication）
    slow: 執行時間 > 5 秒的測試

# ── 路徑設定 ────────────────────────────────────────────────────────────
# 確保從 workspace root 解析 import
# 搭配 conftest.py 的 sys.path 設定使用

# ── 過濾 ────────────────────────────────────────────────────────────────
# 舊的 legacy 診斷腳本不參與自動收集
# 請透過 pytest tests/unit/ 指定路徑
